<!-- register.html -->
{% extends 'base.html' %}
{% load static %}

{% block title %}Inscription{% endblock %}

{% block page_styles %}
    <link rel="stylesheet" href="{% static 'css/auth/register.css' %}">
{% endblock %}

{% block content %}
<div class="auth-form-wrapper">
    <h2>Inscription</h2>
    <form id="registerForm" method="POST" action="/api/accounts/register/">
        {% csrf_token %}
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="votre@email.com" required>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="form-group">
            <label for="first_name">Prénom <span class="optional">(optionnel)</span></label>
            <input type="text" id="first_name" name="first_name" placeholder="Votre prénom">
        </div>

        <div class="form-group">
            <label for="last_name">Nom <span class="optional">(optionnel)</span></label>
            <input type="text" id="last_name" name="last_name" placeholder="Votre nom">
        </div>

        <div class="form-group">
            <label for="phone">Téléphone <span class="optional">(optionnel)</span></label>
            <input type="tel" id="phone" name="phone" placeholder="+33 6 12 34 56 78">
        </div>

        <button type="submit" class="btn-register">Créer le compte</button>
    </form>

    <div class="message" id="response">
        Veuillez remplir le formulaire d'inscription
    </div>

    <div class="footer-link">
        <p>Déjà un compte ? <a href="/login/">Se connecter</a></p>
    </div>
</div>

<script>
    const responseElement = document.getElementById('response');

    function getCsrfToken() {
        return document.cookie.split('; ')
            .find(row => row.startsWith('csrftoken='))
            ?.split('=')[1];
    }

    document.getElementById('registerForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(event.target);
        const data = Object.fromEntries(formData.entries());
        delete data['csrfmiddlewaretoken'];

        // Filter out empty optional fields
        for (const key in data) {
            if (data[key] === '') {
                delete data[key];
            }
        }

        responseElement.className = 'message loading';
        responseElement.textContent = 'Création du compte...';

        try {
            const response = await fetch(event.target.action, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken()
                },
                body: JSON.stringify(data),
            });

            if (response.ok) {
                responseElement.className = 'message success';
                responseElement.textContent = 'Compte créé avec succès ! Vous pouvez maintenant vous connecter.';
            } else {
                const result = await response.json();
                responseElement.className = 'message error';
                let errorMessage = 'Erreurs détectées :\n';
                for (const field in result) {
                    errorMessage += `• ${field}: ${result[field].join(', ')}\n`;
                }
                responseElement.textContent = errorMessage;
            }
        } catch (error) {
            responseElement.className = 'message error';
            responseElement.textContent = 'Erreur de connexion. Veuillez réessayer.';
        }
    });
</script>
{% endblock %}
