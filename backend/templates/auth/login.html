<!-- login.html -->
{% extends 'base.html' %}
{% load static %}

{% block title %}Connexion{% endblock %}

{% block page_styles %}
    <link rel="stylesheet" href="{% static 'css/auth/login.css' %}">
{% endblock %}

{% block content %}
<div class="auth-form-wrapper">
    <h2>Connexion</h2>
    <form id="loginForm" method="POST" action="/api/auth/token/">
        {% csrf_token %}
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="votre@email.com" required>
        </div>
        
        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login">Se connecter</button>
    </form>

    <div class="message" id="response">
        Veuillez vous connecter
    </div>

    <div class="footer-link">
        <p>Pas encore de compte ? <a href="/register/">Créer un compte</a></p>
    </div>
</div>

<script>
    const responseElement = document.getElementById('response');
    
    function getCsrfToken() {
        return document.cookie.split('; ')
            .find(row => row.startsWith('csrftoken='))
            ?.split('=')[1];
    }

    document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(event.target);
        const data = Object.fromEntries(formData.entries());
        delete data['csrfmiddlewaretoken'];

        responseElement.className = 'message loading';
        responseElement.textContent = 'Connexion en cours...';

        try {
            const response = await fetch(event.target.action, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken()
                },
                body: JSON.stringify(data),
            });

            if (response.ok) {
                responseElement.className = 'message success';
                responseElement.textContent = 'Connexion réussie ! Redirection...';
                // In a real app, you would now save the token and redirect.
            } else {
                responseElement.className = 'message error';
                responseElement.textContent = 'Email ou mot de passe incorrect. Veuillez réessayer.';
            }
        } catch (error) {
            responseElement.className = 'message error';
            responseElement.textContent = 'Erreur de connexion. Veuillez réessayer.';
        }
    });
</script>
{% endblock %}
